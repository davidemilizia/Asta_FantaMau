name: Aggiorna Voti

on:
  workflow_dispatch:
    inputs:
      giornata:
        description: "Numero giornata"
        required: true
        default: "1"

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Crea cartella dati_giornate
        run: |
          mkdir -p dati_giornate

      - name: Genera CSV giornata
        run: |
          python scripts/aggiorna_voti.py "${{ github.event.inputs.giornata }}"

      - name: Verifica file creato
        run: |
          ls -la dati_giornate

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dati_giornate/*.csv

          git diff --staged --quiet && echo "Nessuna modifica" && exit 0

          git commit -m "Aggiornamento voti giornata ${{ github.event.inputs.giornata }}"

          git pull --rebase origin main

          git push origin main
