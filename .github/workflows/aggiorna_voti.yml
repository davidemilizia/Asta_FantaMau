name: Aggiorna Voti

on:
  workflow_dispatch:
    inputs:
      giornata:
        description: "Numero giornata"
        required: true
        default: "1"

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Crea cartella dati_giornate
        run: |
          mkdir -p dati_giornate

      - name: Genera CSV giornata
        run: |
          python scripts/aggiorna_voti.py "${{ github.event.inputs.giornata }}"

      - name: Verifica file creato
        run: |
          ls
