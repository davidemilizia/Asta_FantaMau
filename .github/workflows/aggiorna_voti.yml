name: Aggiorna Voti

on:
  workflow_dispatch:
    inputs:
      giornata:
        description: "Giornata"
        required: true
        default: "1"

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install requests beautifulsoup4 pandas

      - run: |
          python aggiorna_voti.py ${{ github.event.inputs.giornata }}

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add dati_giornate/*.csv

          git commit -m "Aggiornamento giornata ${{ github.event.inputs.giornata }}" || exit 0

          git push
