name: Aggiorna Voti Automaticamente

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *' 
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
    - cron: '0 23 * * *'
    

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Crea cartella dati_giornate
        run: |
          mkdir -p dati_giornate

      - name: Aggiorna tutte le giornate
        run: |
          for i in $(seq 1 38)
          do
            echo "Aggiorno giornata $i"
            python aggiorna_voti.py "$i"
          done

      - name: Verifica file creati
        run: |
          ls -la dati_giornate

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dati_giornate/*.csv

          git diff --staged --quiet && echo "Nessuna modifica trovata" && exit 0

          git commit -m "Aggiornamento automatico voti"

          git pull --rebase origin main

          git push origin main
